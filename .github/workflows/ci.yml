name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  npm-quality:
    name: npm quality (Node 22)
    uses: abijith-suresh/workflows/.github/workflows/npm-quality.yml@3f5d559a9f9484deef9f881d4ee10f82ec097d21 # central PR #7 exact head; update to a release pin after PR #7 is released
    with:
      node-version: "22.23.2"
      npm-version: "11.16.0"
      working-directory: .
      verify-command: npm run verify
    permissions:
      contents: read

  changeset-policy:
    name: Changeset policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Check Changeset policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          npm run changeset:check -- \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --head-ref "$HEAD_REF" \
            --head-repo "$HEAD_REPO" \
            --base-repo "$BASE_REPO"

  cli-node-24:
    name: CLI compatibility (Node 24)
    uses: abijith-suresh/workflows/.github/workflows/npm-quality.yml@3f5d559a9f9484deef9f881d4ee10f82ec097d21 # central PR #7 exact head; update to a release pin after PR #7 is released
    with:
      node-version: "24.19.0"
      npm-version: "11.16.0"
      working-directory: .
      verify-command: >-
        npm run typecheck --workspace @abijith-suresh/outpost &&
        npm run test --workspace @abijith-suresh/outpost
    permissions:
      contents: read

  cli-build-smoke:
    name: CLI build and smoke (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build --workspace @abijith-suresh/outpost

      - name: Installed-package smoke test
        run: npm run test:smoke --workspace @abijith-suresh/outpost

  website-build:
    name: Website build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build --workspace outpost-website

  validate-22:
    name: validate (22)
    if: always()
    needs:
      - npm-quality
      - changeset-policy
      - cli-build-smoke
      - website-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Confirm Node 22 verification
        env:
          QUALITY_RESULT: ${{ needs.npm-quality.result }}
          CHANGESET_RESULT: ${{ needs.changeset-policy.result }}
          CLI_BUILD_RESULT: ${{ needs.cli-build-smoke.result }}
          WEBSITE_BUILD_RESULT: ${{ needs.website-build.result }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_RESULT" != success || "$CLI_BUILD_RESULT" != success || "$WEBSITE_BUILD_RESULT" != success ]]; then
            printf 'Node 22 verification failed: quality=%s changeset=%s cli-build=%s website-build=%s\n' \
              "$QUALITY_RESULT" "$CHANGESET_RESULT" "$CLI_BUILD_RESULT" "$WEBSITE_BUILD_RESULT" >&2
            exit 1
          fi
          if [[ "$CHANGESET_RESULT" != success && "$CHANGESET_RESULT" != skipped ]]; then
            printf 'Changeset policy failed: %s\n' "$CHANGESET_RESULT" >&2
            exit 1
          fi
          echo 'Node 22 verification passed.'

  validate-24:
    name: validate (24)
    if: always()
    needs:
      - cli-node-24
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Confirm Node 24 compatibility
        env:
          CLI_RESULT: ${{ needs.cli-node-24.result }}
        run: |
          set -euo pipefail
          if [[ "$CLI_RESULT" != success ]]; then
            printf 'Node 24 compatibility failed: %s\n' "$CLI_RESULT" >&2
            exit 1
          fi
          echo 'Node 24 compatibility passed.'
