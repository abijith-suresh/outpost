name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  npm-quality:
    name: npm quality (Node 24)
    uses: abijith-suresh/workflows/.github/workflows/npm-quality.yml@9c9e55ab629eafe5b5edbae9857b1d66fb384f8c # central workflows v0.2.0; zero-input root-contract workflow
    permissions:
      contents: read

  changeset-policy:
    name: Changeset policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js from repository version file
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install dependencies
        run: npm ci

      - name: Check Changeset policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          npm run changeset:check -- \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --head-ref "$HEAD_REF" \
            --head-repo "$HEAD_REPO" \
            --base-repo "$BASE_REPO"

  cli-build-smoke:
    name: CLI build and smoke (Node 24, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js from repository version file
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build --workspace @abijith-suresh/outpost

      - name: Settings and path regressions on native platform
        run: npm run test --workspace @abijith-suresh/outpost -- tests/settings.test.ts tests/path-safety.test.ts tests/windows-git-path.test.ts tests/repo-retain.test.ts tests/repo-remove.test.ts tests/create-bases.test.ts tests/workspace-resume.test.ts tests/create-reuse-branch.test.ts --testTimeout=30000

      - name: Installed-package smoke test
        run: npm run test:smoke --workspace @abijith-suresh/outpost

  website-build:
    name: Website build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js from repository version file
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact npm from package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node --print "require('./package.json').packageManager ?? ''")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json must declare an exact npm packageManager as npm@major.minor.patch" >&2
            exit 1
          fi
          npm install --global "$package_manager"

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build --workspace outpost-website

  # main still requires these historical names. They are temporary aggregation
  # aliases only: both report the same Node 24 jobs above and never set up Node 22.
  # Remove them in the branch-protection migration after this PR.
  validate-22:
    name: validate (22)
    if: always()
    needs:
      - npm-quality
      - changeset-policy
      - cli-build-smoke
      - website-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Confirm Node 24-only verification
        env:
          QUALITY_RESULT: ${{ needs.npm-quality.result }}
          CHANGESET_RESULT: ${{ needs.changeset-policy.result }}
          CLI_BUILD_RESULT: ${{ needs.cli-build-smoke.result }}
          WEBSITE_BUILD_RESULT: ${{ needs.website-build.result }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_RESULT" != success || "$CLI_BUILD_RESULT" != success || "$WEBSITE_BUILD_RESULT" != success ]]; then
            printf 'Node 24 verification failed: quality=%s changeset=%s cli-build=%s website-build=%s\n' \
              "$QUALITY_RESULT" "$CHANGESET_RESULT" "$CLI_BUILD_RESULT" "$WEBSITE_BUILD_RESULT" >&2
            exit 1
          fi
          if [[ "$CHANGESET_RESULT" != success && "$CHANGESET_RESULT" != skipped ]]; then
            printf 'Changeset policy failed: %s\n' "$CHANGESET_RESULT" >&2
            exit 1
          fi
          echo 'Temporary validate (22) alias passed using Node 24-only jobs.'

  validate-24:
    name: validate (24)
    if: always()
    needs:
      - npm-quality
      - changeset-policy
      - cli-build-smoke
      - website-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Confirm Node 24-only verification
        env:
          QUALITY_RESULT: ${{ needs.npm-quality.result }}
          CHANGESET_RESULT: ${{ needs.changeset-policy.result }}
          CLI_BUILD_RESULT: ${{ needs.cli-build-smoke.result }}
          WEBSITE_BUILD_RESULT: ${{ needs.website-build.result }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_RESULT" != success || "$CLI_BUILD_RESULT" != success || "$WEBSITE_BUILD_RESULT" != success ]]; then
            printf 'Node 24 verification failed: quality=%s changeset=%s cli-build=%s website-build=%s\n' \
              "$QUALITY_RESULT" "$CHANGESET_RESULT" "$CLI_BUILD_RESULT" "$WEBSITE_BUILD_RESULT" >&2
            exit 1
          fi
          if [[ "$CHANGESET_RESULT" != success && "$CHANGESET_RESULT" != skipped ]]; then
            printf 'Changeset policy failed: %s\n' "$CHANGESET_RESULT" >&2
            exit 1
          fi
          echo 'Temporary validate (24) alias passed using Node 24-only jobs.'
