name: Native npm wait probe
on:
  pull_request:
    branches: [main]
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: npm-wait-probe-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  snapshot-install-wait-probe:
    name: Native npm snapshot-install wait observer (diagnostic only)
    if: >-
      github.repository == 'abijith-suresh/outpost' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/native-npm-wait-probe' &&
      github.event.label.name == format('npmwait-{0}', github.event.pull_request.head.sha) &&
      github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed diagnostic head once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install existing exact npm pin
        shell: bash
        run: npm install --global npm@11.16.0
      - name: One install-only observation, without candidate acceptance
        shell: pwsh
        run: |
          $npmCommand = (Get-Command npm.cmd -CommandType Application -ErrorAction Stop).Source
          node scripts/probe-npm-wait.mjs --npm-command "$npmCommand"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
